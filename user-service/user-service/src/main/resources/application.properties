server.port=8081

spring.application.name=user-service

# Database - MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Tejaswini@1331
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=replace-this-with-a-long-random-secret-key-min-32-chars
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics